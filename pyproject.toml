[build-system]
requires = ["setuptools>=61.0", "wheel", "pybind11>=2.6.0", "cmake>=3.13"]
build-backend = "setuptools.build_meta"

[project]
name = "seal-python"
version = "4.1.5"
description = "Python bindings for Microsoft SEAL - Homomorphic Encryption Library"
readme = "README.md"
authors = [
    {name = "Chandradutt Patel", email = "cnpatel5746@gmail.com"}
]
maintainers = [
    {name = "Chandradutt Patel", email = "cnpatel5746@gmail.com"}
]
license = {text = "MIT"}
keywords = [
    "homomorphic-encryption",
    "cryptography",
    "privacy",
    "seal",
    "microsoft-seal",
    "ckks",
    "bfv",
    "bgv",
    "fhe",
    "encryption",
    "numpy"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.19.0",
    "pybind11>=2.6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.2.0"
]
docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.2.0",
    "myst-parser>=1.0.0"
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]

[project.urls]
Homepage = "https://github.com/chandradutt5746/SEAL-PYTHON-4.1.5"
Documentation = "https://github.com/chandradutt5746/SEAL-PYTHON-4.1.5/blob/main/README.md"
Repository = "https://github.com/chandradutt5746/SEAL-PYTHON-4.1.5"
Issues = "https://github.com/chandradutt5746/SEAL-PYTHON-4.1.5/issues"
Changelog = "https://github.com/chandradutt5746/SEAL-PYTHON-4.1.5/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["seal"]
include-package-data = true

[tool.setuptools.package-data]
seal = ["*.so", "*.pyd", "py.typed"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | third_party
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
extend_skip_glob = ["third_party/*", "build/*"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
exclude = ["third_party", "build"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning"
]

[tool.coverage.run]
source = ["seal"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
